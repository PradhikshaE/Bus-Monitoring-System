<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Bus Monitoring and Attendance System</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-logo">
                <div class="sidebar-logo-icon">
                    <i class="fas fa-bus"></i>
                </div>
                <h1>Bus Tracker</h1>
            </div>
            
            <div class="login-header">
                <h2>Welcome Back</h2>
                <p>Please enter your credentials to access the admin console</p>
            </div>
            
            {% if error %}
            <div class="alert-danger">
                <i class="fas fa-exclamation-circle"></i> {{ error }}
            </div>
            {% endif %}
            
            <form action="{{ url_for('login') }}" method="POST">
                <div class="form-group">
                    <label for="username">USERNAME</label>
                    <div style="position: relative;">
                        <input type="text" id="username" name="username" placeholder="Enter username" required value="admin" style="padding-left: 36px;">
                        <i class="fas fa-user" style="position: absolute; left: 12px; top: 12px; color: var(--text-muted);"></i>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="password">PASSWORD</label>
                    <div style="position: relative;">
                        <input type="password" id="password" name="password" placeholder="Enter password" required value="admin123" style="padding-left: 36px;">
                        <i class="fas fa-lock" style="position: absolute; left: 12px; top: 12px; color: var(--text-muted);"></i>
                    </div>
                </div>
                
                <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; margin-top: 12px; padding: 12px;">
                    Login to Dashboard
                </button>
            </form>
            
            <div class="login-footer">
                <p>© 2026 Fleet & Attendance Tracker. IoT Ready.</p>
                <p style="font-size: 0.75rem; margin-top: 8px; color: var(--primary-light);">Demo: admin / admin123</p>
                <p style="margin-top: 12px; font-size: 0.85rem;">
                    <a href="{{ url_for('student_portal_page') }}" style="color: var(--primary-light); text-decoration: none; font-weight: 600;">
                        <i class="fas fa-user-graduate"></i> Go to Student Portal
                    </a>
                </p>
            </div>
        </div>
    </div>
</body>
</html>
